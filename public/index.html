<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>TikWM Proxy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>TikWM Proxy</h1>
    <div class="nav">
      <span class="tag" hidden>v2</span>
      <a class="icon-btn" href="/index.html" hidden title="Home">
        <i class="fa-solid fa-house" style="font-size:10px;"></i>
      </a>
      <a class="icon-btn" href="/local.html" title="Local">
        <i class="fa-solid fa-file-code" style="font-size:10px;"></i>
      </a>
      <a class="icon-btn" href="/response.html" title="Response">
        <i class="fa-solid fa-terminal" style="font-size:10px;"></i>
      </a>
      <button class="icon-btn" id="downloadJsonBtn" title="Download all responses as JSON" style="cursor:pointer;">
        <i class="fa-solid fa-download" style="font-size:10px;"></i>
      </button>
    </div>
  </header>

  <main>
    <form id="form" autocomplete="off">
      <div class="field">
        <label for="unique_id">Unique ID</label>
        <input id="unique_id" value="@tiktok" spellcheck="false" />
      </div>

      <div class="row">
        <div class="field">
          <label for="endpoint">Endpoint</label>
          <select id="endpoint">
            <option value="posts">Posts</option>
            <option value="story">Story</option>
            <option value="search">Search</option>
          </select>
        </div>
        <div class="field">
          <label for="count">Count</label>
          <input id="count" type="number" value="12" min="1" max="50" />
        </div>
      </div>

      <div class="field" id="keywordsField" hidden>
        <label for="keywords">Keywords</label>
        <input id="keywords" value="cosplay" spellcheck="false" />
      </div>

      <div class="field">
        <label for="cursor">Cursor <span style="text-transform:none;color:#565660;">(optional)</span></label>
        <input id="cursor" placeholder="default" />
      </div>

      <button type="submit" class="primary" id="submitBtn">Fetch</button>
    </form>

    <div id="status"></div>
    <div id="profileCard" class="profile-card" hidden>
      <img class="profile-avatar" id="profileAvatar" alt="" />
      <div class="profile-info">
        <div class="profile-nickname" id="profileNickname"></div>
        <div class="profile-unique" id="profileUnique"></div>
      </div>
      <div class="profile-flag" id="profileFlag"></div>
    </div>
    <div id="results"></div>
  </main>

  <footer>
    <div id="debug">cursor: — · hasMore: false · loading: false</div>
    <button class="ghost" id="loadMore" hidden>Load more</button>
  </footer>

  <div class="modal" id="playerModal">
    <button class="close" id="playerClose" aria-label="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <video id="player" playsinline controls></video>
  </div>
<script src="index.js"></script>
</body>
</html>
